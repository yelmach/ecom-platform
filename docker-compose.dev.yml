services:
  # ----------------------------
  # Kafka
  # ----------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: ecom-kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT}:${KAFKA_HOST_PORT}"
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Network configuration
      KAFKA_LISTENERS: INTERNAL://:${KAFKA_PORT},HOST://:${KAFKA_HOST_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:${KAFKA_PORT},HOST://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:${KAFKA_PORT}", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - ecom-network

  # ----------------------------
  # DATABASE (MongoDB)
  # ----------------------------
  mongo:
    image: mongo:7
    container_name: ecom-mongo
    command: ["mongod", "--port", "${MONGO_PORT}"]
    ports:
      - "127.0.0.1:${MONGO_PORT}:${MONGO_PORT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_USER_DATABASE}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --port ${MONGO_PORT} --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecom-network

  # ----------------------------
  # OBJECT STORAGE (MinIO)
  # ----------------------------
  minio:
    # Community MinIO build; the upstream image is no longer publicly available.
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: ecom-minio
    command: server /data --address ":${MINIO_API_PORT}" --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - "127.0.0.1:${MINIO_API_PORT}:${MINIO_API_PORT}"
      - "127.0.0.1:${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${MINIO_API_PORT}/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecom-network

  # ----------------------------
  # SERVICE DISCOVERY (Eureka)
  # ----------------------------
  discovery-service:
    build:
      context: ./backend/discovery-service
    container_name: ecom-discovery-service
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:${EUREKA_PORT}:${EUREKA_PORT}"
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${EUREKA_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecom-network

  # ----------------------------
  # MEDIA SERVICE
  # ----------------------------
  media-service:
    build:
      context: ./backend/media-service
    container_name: ecom-media-service
    env_file:
      - ./.env
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${MEDIA_SERVICE_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecom-network

  # ----------------------------
  # USER SERVICE
  # ----------------------------
  user-service:
    build:
      context: ./backend/user-service
    container_name: ecom-user-service
    env_file:
      - ./.env
    volumes:
      - ./backend/keys/private.pem:${JWT_PRIVATE_KEY_PATH}:ro
      - ./backend/keys/public.pem:${JWT_PUBLIC_KEY_PATH}:ro
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${USER_SERVICE_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecom-network

  # ----------------------------
  # PRODUCT SERVICE
  # ----------------------------
  product-service:
    build:
      context: ./backend/product-service
    container_name: ecom-product-service
    env_file:
      - ./.env
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${PRODUCT_SERVICE_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecom-network

  # ----------------------------
  # API GATEWAY
  # ----------------------------
  gateway-service:
    build:
      context: ./backend/gateway-service
    container_name: ecom-gateway-service
    env_file:
      - ./.env
    volumes:
      - ./backend/keys/public.pem:${JWT_PUBLIC_KEY_PATH}:ro
    depends_on:
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${GATEWAY_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecom-network

  # ----------------------------
  # FRONTEND (Angular + Nginx)
  # ----------------------------
  frontend:
    build:
      context: ./frontend
    container_name: ecom-frontend
    depends_on:
      gateway-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:6100"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6100/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    networks:
      - ecom-network

# ----------------------------
# NETWORKS & VOLUMES
# ----------------------------
networks:
  ecom-network:
    driver: bridge

volumes:
  kafka-data:
  mongo-data:
  minio-data:
