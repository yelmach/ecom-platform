name: sonarqube

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${SONAR_DB_NAME}
      POSTGRES_USER: ${SONAR_DB_USER}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sonar-network

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SONARQUBE_PORT}:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/${SONAR_DB_NAME}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:9000/api/system/status | grep -Eq ''"status"[[:space:]]*:[[:space:]]*"UP"''']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
    networks:
      - sonar-network
      - jenkins

volumes:
  postgres_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sonar-network:
  jenkins:
    external: true
    name: jenkins_jenkins_network
