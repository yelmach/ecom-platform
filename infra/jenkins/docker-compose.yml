name: jenkins

services:
  jenkins:
    build:
      context: ./controller
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JENKINS_PORT}:8080"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /usr/share/jenkins/config/jenkins.yaml
      JENKINS_PUBLIC_URL: ${JENKINS_PUBLIC_URL}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      JENKINS_REPOSITORY_URL: ${JENKINS_REPOSITORY_URL}
      JENKINS_REPOSITORY_BRANCH: ${JENKINS_REPOSITORY_BRANCH}
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins_network
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8080/login]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  agent:
    build:
      context: ./agent
    init: true
    restart: unless-stopped
    depends_on:
      jenkins:
        condition: service_healthy
    command:
      - -url
      - http://jenkins:8080/
      - -name
      - jenkins-agent
      - -secret
      - "${JENKINS_AGENT_SECRET:-}"
      - -webSocket
      - -workDir
      - /home/jenkins/agent
    volumes:
      - agent_work:/home/jenkins/agent
      - maven_cache:/home/jenkins/.m2
      - npm_cache:/home/jenkins/.npm
      - sonar_cache:/home/jenkins/.sonar
    networks:
      - jenkins_network

volumes:
  jenkins_home:
  agent_work:
  maven_cache:
  npm_cache:
  sonar_cache:

networks:
  jenkins_network:
    driver: bridge
