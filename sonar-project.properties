sonar.projectKey=ecom-platform
sonar.projectName=ecom-platform
sonar.sourceEncoding=UTF-8

sonar.sources=backend/discovery-service/src/main/java,backend/gateway-service/src/main/java,backend/user-service/src/main/java,backend/product-service/src/main/java,backend/media-service/src/main/java,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=backend/**/src/test/java/**/*.java,frontend/src/**/*.spec.ts
sonar.exclusions=**/target/**,**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js

sonar.java.binaries=backend/discovery-service/target/classes,backend/gateway-service/target/classes,backend/user-service/target/classes,backend/product-service/target/classes,backend/media-service/target/classes
sonar.junit.reportPaths=backend/discovery-service/target/surefire-reports,backend/gateway-service/target/surefire-reports,backend/user-service/target/surefire-reports,backend/product-service/target/surefire-reports,backend/media-service/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/discovery-service/target/site/jacoco/jacoco.xml,backend/gateway-service/target/site/jacoco/jacoco.xml,backend/user-service/target/site/jacoco/jacoco.xml,backend/product-service/target/site/jacoco/jacoco.xml,backend/media-service/target/site/jacoco/jacoco.xml

