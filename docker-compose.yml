name: ecom-prod

x-runtime: &runtime
  restart: unless-stopped
  networks: [ecom-network]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-eureka-environment: &eureka-environment
  EUREKA_HOST: ${EUREKA_HOST}
  EUREKA_PORT: "${EUREKA_PORT}"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

x-mongo-environment: &mongo-environment
  MONGO_HOST: ${MONGO_HOST}
  MONGO_PORT: "${MONGO_PORT}"
  MONGO_USERNAME: ${MONGO_USERNAME}
  MONGO_PASSWORD: ${MONGO_PASSWORD}

x-health-check: &health-check
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 20s

services:
  # ----------------------------
  # DATABASE (MongoDB)
  # ----------------------------
  mongo:
    <<: *runtime
    image: mongo:7
    command: [mongod, --port, "${MONGO_PORT}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      <<: *health-check
      test: [CMD-SHELL, 'mongosh --quiet --port ${MONGO_PORT} --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.runCommand({ ping: 1 }).ok ? 0 : 1)"']

  # ----------------------------
  # OBJECT STORAGE (MinIO)
  # ----------------------------
  minio:
    <<: *runtime
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --address :${MINIO_API_PORT} --console-address :${MINIO_CONSOLE_PORT}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      <<: *health-check
      test: [CMD, curl, -fsS, "http://localhost:${MINIO_API_PORT}/minio/health/live"]

  # ----------------------------
  # Kafka
  # ----------------------------
  kafka:
    <<: *runtime
    image: apache/kafka:4.3.1
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Network configuration
      KAFKA_LISTENERS: INTERNAL://:${KAFKA_PORT},CONTROLLER://:${KAFKA_CONTROLLER_PORT}
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # Single-broker settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka
    healthcheck:
      <<: *health-check
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, "kafka:${KAFKA_PORT}", --list]

  # ----------------------------
  # SERVICE DISCOVERY (Eureka)
  # ----------------------------
  discovery-service:
    <<: *runtime
    image: ${GHCR_PREFIX}/ecom-discovery-service:${IMAGE_TAG}
    environment:
      <<: *eureka-environment
    healthcheck:
      <<: *health-check
      test: [CMD, curl, -fsS, "http://localhost:${EUREKA_PORT}/actuator/health"]

  # ----------------------------
  # USER SERVICE
  # ----------------------------
  user-service:
    <<: *runtime
    image: ${GHCR_PREFIX}/ecom-user-service:${IMAGE_TAG}
    environment:
      <<: [*eureka-environment, *mongo-environment]
      USER_SERVICE_PORT: "${USER_SERVICE_PORT}"
      MONGO_USER_DATABASE: ${MONGO_USER_DATABASE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    volumes:
      - type: bind
        source: ./backend/keys/private.pem
        target: ${JWT_PRIVATE_KEY_PATH}
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./backend/keys/public.pem
        target: ${JWT_PUBLIC_KEY_PATH}
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      <<: *health-check
      test: [CMD, curl, -fsS, "http://localhost:${USER_SERVICE_PORT}/actuator/health"]

  # ----------------------------
  # PRODUCT SERVICE
  # ----------------------------
  product-service:
    <<: *runtime
    image: ${GHCR_PREFIX}/ecom-product-service:${IMAGE_TAG}
    environment:
      <<: [*eureka-environment, *mongo-environment]
      PRODUCT_SERVICE_PORT: "${PRODUCT_SERVICE_PORT}"
      MONGO_PRODUCT_DATABASE: ${MONGO_PRODUCT_DATABASE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      <<: *health-check
      test: [CMD, curl, -fsS, "http://localhost:${PRODUCT_SERVICE_PORT}/actuator/health"]

  # ----------------------------
  # MEDIA SERVICE
  # ----------------------------
  media-service:
    <<: *runtime
    image: ${GHCR_PREFIX}/ecom-media-service:${IMAGE_TAG}
    environment:
      <<: [*eureka-environment, *mongo-environment]
      MEDIA_SERVICE_PORT: "${MEDIA_SERVICE_PORT}"
      MONGO_MEDIA_DATABASE: ${MONGO_MEDIA_DATABASE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MEDIA_PUBLIC_BASE_URL: https://${APP_DOMAIN}/ecom-media
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      <<: *health-check
      test: [CMD, curl, -fsS, "http://localhost:${MEDIA_SERVICE_PORT}/actuator/health"]

  # ----------------------------
  # API GATEWAY
  # ----------------------------
  gateway-service:
    <<: *runtime
    image: ${GHCR_PREFIX}/ecom-gateway-service:${IMAGE_TAG}
    environment:
      <<: *eureka-environment
      GATEWAY_PORT: "${GATEWAY_PORT}"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}
    volumes:
      - type: bind
        source: ./backend/keys/public.pem
        target: ${JWT_PUBLIC_KEY_PATH}
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      discovery-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      <<: *health-check
      test: [CMD, curl, -fsS, "http://localhost:${GATEWAY_PORT}/actuator/health"]

  # ----------------------------
  # FRONTEND (Angular + Nginx)
  # ----------------------------
  frontend:
    <<: *runtime
    image: ${GHCR_PREFIX}/ecom-frontend:${IMAGE_TAG}
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:6100"
    depends_on:
      gateway-service:
        condition: service_healthy
    healthcheck:
      <<: *health-check
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:6100/healthz"]

networks:
  ecom-network:
    driver: bridge

volumes:
  mongo-data:
  minio-data:
  kafka-data:
