map $http_x_forwarded_proto $ecom_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 6100;
  server_name _;
  client_max_body_size 11m;
  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ ^/(auth|users|products|media|ecom-media)(/|$) {
    proxy_pass http://gateway-service:6200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ecom_forwarded_proto;
  }
}
